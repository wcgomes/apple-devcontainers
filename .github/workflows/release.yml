name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (with or without v prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}"

      - name: Inject version
        shell: bash
        run: bash scripts/inject-version.sh "${{ steps.version.outputs.version }}"

      - name: Run tests
        run: swift run adevcontainerTests

      - name: Release build
        run: swift build -c release --product adevcontainer

      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .build/release/adevcontainer ]]; then
            BIN=".build/release/adevcontainer"
          elif [[ -f .build/arm64-apple-macosx/release/adevcontainer ]]; then
            BIN=".build/arm64-apple-macosx/release/adevcontainer"
          else
            echo "error: adevcontainer binary not found under .build/" >&2
            find .build -name adevcontainer -type f 2>/dev/null || true
            exit 1
          fi
          echo "Using binary: ${BIN}"
          mkdir -p dist
          cp "${BIN}" dist/adevcontainer
          export COPYFILE_DISABLE=1
          tar -C dist -czf adevcontainer-macos-arm64.tar.gz adevcontainer
          shasum -a 256 adevcontainer-macos-arm64.tar.gz > adevcontainer-macos-arm64.tar.gz.sha256
          ls -la adevcontainer-macos-arm64.tar.gz adevcontainer-macos-arm64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            adevcontainer-macos-arm64.tar.gz
            adevcontainer-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
