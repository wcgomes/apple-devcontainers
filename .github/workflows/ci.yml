name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run tests
        # Prepare generated, ignored Swift payloads before any Swift target builds.
        # Build the CLI explicitly for isolated internal-entry subprocess tests.
        run: |
          sh scripts/build-guest-credential-relay.sh
          sh scripts/test-guest-credential-relay.sh
          swift build --product adevcontainer
          ADEVCONTAINER_CREDENTIAL_TESTS_ONLY=1 swift run adevcontainerTests
          swift run adevcontainerTests

      - name: Release build
        run: swift build -c release --product adevcontainer

  native-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise shipped static amd64 relay
        run: |
          sh scripts/build-guest-credential-relay.sh --raw-only
          sh scripts/test-guest-credential-relay.sh
          sh Tests/GuestGitCredentialRelay/build_artifacts_tests.sh
